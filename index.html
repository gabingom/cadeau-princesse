<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a0a1f">
<title>Pour ma princesse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Fraunces:opsz,wght@9..144,500;9,600&display=swap" rel="stylesheet">
<style>
:root{
  --wine-950:#2a0612; --wine-900:#3d0818; --wine-800:#5a0c26; --wine-600:#8a1038; --wine-500:#a3123f;
  --cream:#f4e6d0; --paper:#fbf3e6; --gold:#e8c9a0; --ink:#3a1420; --rose:#c9677f;
  --display:'Fraunces',Georgia,serif; --body:'Cormorant Garamond',Georgia,serif; --script:'Caveat','Segoe Script',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-size:1.25rem;line-height:1.6;color:var(--paper);background:var(--wine-950);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}

/* ---------- écrans d'entrée ---------- */
.screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at 50% 85%,#7a0f33 0%,transparent 55%),radial-gradient(ellipse at 50% 0%,#4a0a1f 0%,var(--wine-950) 70%);
  transition:opacity .9s ease,visibility .9s}
.screen.out{opacity:0;visibility:hidden}

/* porte */
.gate{width:min(420px,100%);border:1px solid rgba(232,201,160,.35);padding:44px 26px 34px;text-align:center}
.gate .tag{font-size:.95rem;letter-spacing:.12em;color:var(--gold);margin-bottom:22px}
.mini-env{width:84px;height:54px;margin:0 auto 18px;background:linear-gradient(180deg,#b3174a,#8a1038);position:relative;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.mini-env::after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:.8rem;color:#ffe3e3;text-shadow:0 0 8px #fff8}
.gate h1{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,8vw,2.4rem);line-height:1.15;margin-bottom:12px}
.gate .ask{font-style:italic;color:#e5c9c9;margin-bottom:22px}
.gate input{width:100%;padding:15px 14px;border:0;background:var(--paper);color:var(--ink);font:italic 1.15rem var(--body);margin-bottom:10px;border-radius:0}
.gate input::placeholder{color:#8d7a74}
.btn{width:100%;padding:14px;border:1px solid var(--gold);background:var(--wine-600);color:var(--paper);font:500 1.15rem var(--body);letter-spacing:.04em;transition:background .25s}
.btn:hover{background:var(--wine-500)}
.gate .err{min-height:1.6em;margin-top:12px;font-style:italic;color:#ffb3c1}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* enveloppe */
.env-wrap{text-align:center}
.env-title{font-family:var(--script);font-size:clamp(2.2rem,10vw,3rem);line-height:1.15;margin-bottom:14px;font-weight:500}
.env-sub{font-style:italic;font-size:1.05rem;color:#e5c9c9;margin-bottom:42px}
.env{position:relative;width:min(290px,76vw);aspect-ratio:1.6;margin:0 auto;background:none;border:0;display:block;perspective:900px}
.env>*{position:absolute}
.env .back{inset:0;background:#8a1038;box-shadow:0 22px 40px rgba(0,0,0,.5);z-index:1}
.env .letter{left:7%;right:7%;top:8%;height:78%;background:var(--paper);z-index:2;display:flex;align-items:center;justify-content:center;
  font-family:var(--script);font-size:1.5rem;color:var(--wine-800);padding:10px;line-height:1.15;transition:transform 1s cubic-bezier(.2,.8,.2,1) .55s}
.env .front{inset:0;z-index:3;background:linear-gradient(160deg,#a3123f,#7a0f33);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env .flap{left:0;right:0;top:0;height:58%;z-index:4;background:linear-gradient(180deg,#b3174a,#98123f);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;transition:transform .8s ease,z-index 0s .35s}
.env .seal{left:50%;top:58%;width:44px;height:44px;border-radius:50%;z-index:5;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#c42a5b,#7a0f33);border:2px solid #d4577f;display:flex;align-items:center;justify-content:center;
  color:#ffe2a8;font-size:1.1rem;transition:opacity .3s;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 18px #ff7fa0aa}}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;animation:none}
.env.open .letter{transform:translateY(-52%) scale(1.08)}
.env-hint{margin-top:56px;font-style:italic;color:#c9a9a9;font-size:1.05rem}

/* ---------- page déroulante ---------- */
#site{opacity:0;transition:opacity 1s ease .2s}
#site.show{opacity:1}
section{padding:90px 24px;position:relative}
.wrap{max-width:560px;margin:0 auto}
.wine{background:linear-gradient(180deg,var(--wine-800),var(--wine-600) 55%,var(--wine-800))}
.deep{background:var(--wine-900)}
.light{background:var(--cream);color:var(--ink)}
h2{font-family:var(--display);font-weight:500;font-size:clamp(2rem,8.5vw,2.8rem);line-height:1.12;text-align:center}
.eyebrow{font-size:.9rem;letter-spacing:.14em;color:var(--gold);text-align:center;margin-bottom:14px}
.light .eyebrow{color:#a8714f}

.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 100%,#6d0d2e,transparent 60%),var(--wine-900)}
.hero .scroll{font-size:.95rem;letter-spacing:.14em;color:#d8b7b7}
.hero .line{width:1px;height:46px;background:linear-gradient(var(--gold),transparent);margin:16px auto 0;animation:drip 2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.gifts{padding-top:70px}
.gifts .pic{margin:36px -24px 0;aspect-ratio:4/3;background:#4a0a1f}
.gifts .pic img{width:100%;height:100%;object-fit:cover}

/* tourne-disque */
.player{display:flex;align-items:center;gap:20px;max-width:560px;margin:0 auto}
.vinyl{flex:0 0 118px;width:118px;height:118px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,#150208 0 3px,#2a0a12 3px 5px);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.vinyl::after{content:attr(data-label);position:absolute;inset:34px;border-radius:50%;background:var(--wine-500);display:flex;align-items:center;justify-content:center;
  text-align:center;font:600 .5rem/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#ffe6e6;padding:6px}
.vinyl.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{flex:1;background:var(--paper);color:var(--ink);padding:16px 16px 18px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.card small{display:block;font-style:italic;font-size:1rem;margin-bottom:10px;color:#5d3a3a}
.pill{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 20px;font:500 1.1rem var(--body)}
.card audio{width:100%;accent-color:var(--wine-600)}

/* lettre */
.letter-card{background:var(--paper);color:var(--ink);padding:38px 28px 34px;box-shadow:0 20px 44px rgba(60,20,20,.25);max-width:520px;margin:0 auto}
.letter-card h2{text-align:left;font-size:clamp(1.9rem,8vw,2.4rem);color:#2c1118}
.letter-card h2 span{display:block;font-size:.62em;font-weight:600;margin-top:2px}
.letter-card hr{border:0;border-top:1px solid #b9856c;width:56px;margin:20px 0}
.letter-card p{margin-bottom:14px;font-size:1.22rem}
.letter-card .sign{font-family:var(--script);font-size:1.9rem;color:var(--wine-600);margin:22px 0 0}

/* polaroids */
.polas{position:relative;max-width:420px;margin:46px auto 0;display:flex;flex-direction:column;gap:30px}
.pola{background:#fff;padding:10px 10px 38px;width:72%;box-shadow:0 12px 26px rgba(0,0,0,.4)}
.pola img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#3a0a18}
.pola:nth-child(1){transform:rotate(-5deg);align-self:flex-start}
.pola:nth-child(2){transform:rotate(4deg);align-self:flex-end}
.pola:nth-child(3){transform:rotate(-3deg);align-self:center}
.pola:nth-child(4){transform:rotate(5deg);align-self:flex-end}
.pola:nth-child(5){transform:rotate(-4deg);align-self:flex-start}
.pola figcaption{font-family:var(--script);font-size:1.35rem;color:#4a2a2a;text-align:center;margin-top:8px;line-height:1}

/* timeline */
.timeline{position:relative;max-width:480px;margin:44px auto 0;padding-left:34px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:0;width:1px;background:#b9856c}
.tl{position:relative;margin-bottom:44px;opacity:0;transform:translateY(16px);transition:opacity .8s,transform .8s}
.tl.in{opacity:1;transform:none}
.tl::before{content:"";position:absolute;left:-34px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--cream);border:2px solid #a8714f}
.tl time{font-size:.95rem;letter-spacing:.1em;color:#a8714f}
.tl h3{font-family:var(--display);font-weight:500;font-size:1.6rem;margin:2px 0 12px;color:#2c1118}
.tl img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 28px rgba(60,20,20,.3);background:#c9a8a0}
.tl p{margin-top:12px;font-size:1.15rem;color:#5d3a3a}

/* liste */
.note{background:linear-gradient(135deg,#f8ecd8,#ecd9bd);color:var(--ink);padding:34px 26px 30px;transform:rotate(-1.2deg);max-width:520px;margin:0 auto;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.note h2{text-align:left;font-size:clamp(1.8rem,8vw,2.3rem);margin-bottom:18px;color:#2c1118}
.note ol{list-style:none}
.note li{display:flex;gap:16px;align-items:baseline;padding:13px 4px;border-top:1px solid #b79a80;font-size:1.25rem}
.note li b{font:600 .72rem var(--display);color:var(--wine-600);min-width:20px}

/* jeu */
.quiz{background:var(--wine-950);padding:34px 22px 30px;max-width:520px;margin:0 auto;box-shadow:0 20px 44px rgba(60,20,20,.35);border:1px solid rgba(232,201,160,.2)}
.quiz h2{font-size:clamp(1.7rem,7.5vw,2.2rem);margin:6px 0 24px}
.opt{display:block;width:100%;margin-bottom:12px;padding:14px;background:transparent;border:1px solid rgba(232,201,160,.4);color:var(--paper);font:1.15rem var(--body);transition:background .25s}
.opt:hover{background:rgba(163,18,63,.35)}
.opt.picked{background:var(--wine-600);border-color:var(--gold)}
.quiz .reply{min-height:2.6em;margin-top:6px;font-style:italic;text-align:center;color:var(--gold)}

/* compte à rebours */
.count{background:var(--wine-950);padding:34px 20px;max-width:520px;margin:0 auto;text-align:center;box-shadow:0 20px 44px rgba(60,20,20,.35)}
.glass{width:40px;margin:0 auto 14px}
.count h2{font-size:clamp(1.4rem,6vw,1.8rem);color:var(--gold);margin-bottom:20px}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.boxes div{border:1px solid rgba(232,201,160,.35);padding:12px 2px 8px}
.boxes strong{display:block;font:500 1.6rem var(--display)}
.boxes span{font-size:.7rem;letter-spacing:.1em;color:#d8b7b7}

/* final */
.final{min-height:100svh;display:flex;align-items:center;text-align:center;
  background:linear-gradient(rgba(42,6,18,.55),rgba(42,6,18,.88)),var(--final-bg,none) center/cover,var(--wine-900)}
.final .small{font-style:italic;color:#e5c9c9;margin-bottom:12px}
.final h2{font-size:clamp(2.1rem,10vw,3rem);margin-bottom:10px}
.final .name{font-family:var(--script);font-size:2rem;color:#ff9db4;margin-bottom:26px}
.final .rule{border:0;border-top:1px solid rgba(255,255,255,.2);margin:26px 0}
.final h3{font:500 1.5rem var(--body);margin-bottom:18px}
.reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.react{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px 4px;font-size:1rem;backdrop-filter:blur(6px)}
.react em{display:block;font-style:normal;font-size:1.7rem}
.thanks{min-height:2em;margin-top:18px;font-style:italic;color:var(--gold)}
.float{position:fixed;bottom:12%;font-size:2rem;pointer-events:none;animation:up 2s ease-out forwards;z-index:60}
@keyframes up{to{transform:translateY(-55vh);opacity:0}}

/* petit mot */
.mot{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;
  background:rgba(42,6,18,.94);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.mot.on{opacity:1;visibility:visible}
.mot .x{position:absolute;top:18px;right:18px;background:none;border:0;font-size:1.8rem;color:var(--gold)}
.mot-card{width:min(360px,100%);background:var(--paper);color:var(--ink);padding:22px 20px 18px;box-shadow:0 20px 40px rgba(0,0,0,.5);
  opacity:0;transform:translateY(150px) scale(.55);transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .6s;pointer-events:none}
.mot.out .mot-card{opacity:1;transform:none;pointer-events:auto}
.mot-card input{width:100%;border:0;border-bottom:1px solid #b9856c;background:transparent;padding:10px 2px;font:1.5rem var(--script);color:var(--wine-800);outline:none}
.mot-card small{display:block;margin-top:10px;font-style:italic;color:#7a5a52;font-size:1rem}
.mot .env{width:min(240px,64vw)}
.mot .env .letter{display:none}
.mot-hint{font-style:italic;color:#c9a9a9;min-height:1.5em}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .tl{opacity:1;transform:none}
}
</style>
</head>
<body class="locked">

<!-- ============ ÉCRAN 1 : MOT SECRET ============ -->
<div class="screen" id="gate">
  <form class="gate" id="gateForm" autocomplete="off">
    <p class="tag" id="gTag"></p>
    <div class="mini-env" aria-hidden="true"></div>
    <h1 id="gTitle"></h1>
    <p class="ask" id="gAsk"></p>
    <input id="gInput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Mot secret">
    <button class="btn" type="submit" id="gBtn"></button>
    <p class="err" id="gErr" role="alert"></p>
  </form>
</div>

<!-- ============ ÉCRAN 2 : ENVELOPPE ============ -->
<div class="screen out" id="envScreen">
  <div class="env-wrap">
    <p class="env-title" id="eTitle"></p>
    <p class="env-sub" id="eSub"></p>
    <button class="env" id="env" aria-label="Ouvrir l'enveloppe">
      <span class="back"></span>
      <span class="letter" id="eLetter"></span>
      <span class="front"></span>
      <span class="flap"></span>
      <span class="seal">♥</span>
    </button>
    <p class="env-hint" id="eHint"></p>
  </div>
</div>

<!-- ============ PAGE DÉROULANTE ============ -->
<main id="site">
  <section class="hero">
    <p class="scroll" id="heroText"></p>
    <div class="line"></div>
  </section>

  <section class="wine gifts" id="secGifts">
    <div class="wrap">
      <p class="eyebrow" id="giftsEyebrow"></p>
      <h2 id="giftsTitle"></h2>
    </div>
    <div class="pic" id="giftsPic"></div>
  </section>

  <section class="deep" style="padding:60px 24px">
    <div class="player">
      <div class="vinyl" id="vinyl"></div>
      <div class="card">
        <small id="musicLabel"></small>
        <button class="pill" id="musicBtn" type="button"></button>
        <audio id="music" preload="none" loop></audio>
      </div>
    </div>
  </section>

  <section class="light">
    <article class="letter-card">
      <p class="eyebrow" style="text-align:left" id="letterEyebrow"></p>
      <h2 id="letterTitle"></h2>
      <hr>
      <div id="letterBody"></div>
      <p class="sign" id="letterSign"></p>
    </article>
  </section>

  <section class="wine">
    <div class="wrap">
      <p class="eyebrow" id="memEyebrow"></p>
      <h2 id="memTitle"></h2>
      <div class="polas" id="polas"></div>
    </div>
  </section>

  <section class="light">
    <div class="wrap">
      <p class="eyebrow" id="tlEyebrow"></p>
      <h2 id="tlTitle"></h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section class="wine" style="padding:70px 20px">
    <div class="note">
      <h2 id="listTitle"></h2>
      <ol id="listItems"></ol>
    </div>
  </section>

  <section class="wine" style="padding:40px 24px 30px">
    <div class="player">
      <div class="vinyl" id="vinyl2"></div>
      <div class="card">
        <small id="voiceLabel"></small>
        <audio id="voice" controls preload="none"></audio>
      </div>
    </div>
  </section>

  <section class="light" style="padding:70px 20px">
    <div class="quiz">
      <p class="eyebrow" id="quizEyebrow"></p>
      <h2 id="quizTitle"></h2>
      <div id="quizOpts"></div>
      <p class="reply" id="quizReply"></p>
    </div>
  </section>

  <section class="light" style="padding:0 20px 80px" id="secCount">
    <div class="count">
      <svg class="glass" viewBox="0 0 60 80" aria-hidden="true"><path fill="#e8c9a0" d="M4 2h52v7H4zM4 71h52v7H4z"/><path fill="#e8c9a0" opacity=".85" d="M10 9h40c0 14-12 22-12 31s12 17 12 31H10c0-14 12-22 12-31S10 23 10 9z" opacity=".25"/><path fill="#e8c9a0" d="M24 62h12l6 9H18z"/></svg>
      <h2 id="countTitle"></h2>
      <div class="boxes">
        <div><strong id="cD">0</strong><span>JOURS</span></div>
        <div><strong id="cH">0</strong><span>H</span></div>
        <div><strong id="cM">0</strong><span>MIN</span></div>
        <div><strong id="cS">0</strong><span>S</span></div>
      </div>
    </div>
  </section>

  <section class="final" id="secFinal">
    <div class="wrap">
      <p class="small" id="finSmall"></p>
      <h2 id="finTitle"></h2>
      <p class="name" id="finName"></p>
      <hr class="rule">
      <h3 id="finAsk"></h3>
      <div class="reacts" id="reacts"></div>
      <p class="thanks" id="thanks"></p>
    </div>
  </section>
</main>

<div class="mot" id="mot">
  <button class="x" id="motX" type="button" aria-label="Fermer">×</button>
  <div class="mot-card">
    <input id="motInput" type="text" maxlength="300" autocomplete="off">
    <small id="motSmall"></small>
  </div>
  <button class="env" id="motEnv" type="button" aria-label="Ouvrir l'enveloppe">
    <span class="back"></span><span class="letter"></span><span class="front"></span><span class="flap"></span><span class="seal">♥</span>
  </button>
  <p class="mot-hint" id="motHint"></p>
</div>

<script>
/* =====================================================================
   ✏️  TOUT CE QUE TU PEUX MODIFIER EST ICI (textes, photos, sons, dates)
   Le reste du fichier n'a pas besoin d'être touché.
   ===================================================================== */
const CONTENU = {

  /* ---- Écran 1 : mot secret ---- */
  motSecret: "monsieur",                 // le mot à taper (majuscules/accents ignorés)
  porte: {
    etiquette: "RIEN QUE POUR TOI",
    titre: "Pour ma princesse",
    question: "heyy 😌 comment tu m'appelles chaque matin ?",
    placeholder: "le mot secret",
    bouton: "Ouvrir",
    erreur: "Ce n'est pas le bon mot, essaie encore."
  },

  /* ---- Écran 2 : enveloppe ---- */
  enveloppe: {
    titre: "Pour ma princesse",
    sousTitre: "ouvre",
    textLettre: "Pour ma princesse",
    indice: "Touche l'enveloppe pour découvrir ta surprise..."
  },

  /* ---- Début de la page ---- */
  accroche: "FAIS DÉFILER POUR DÉCOUVRIR",

  /* ---- Cadeaux ---- */
  cadeaux: {
    sur: "03 SURPRISES",
    titre: "Des cadeaux pour toi",
    image: "img/cadeaux.jpg"              // photo d'illustration (ex: fleurs, ours...)
  },

  /* ---- Musique (extrait) ---- */
  musique: {
    legende: "la bande-son de ce moment",
    fichier: "audio/musique.mp3",         // ton extrait de chanson
    bouton: "Écouter la musique",
    boutonPause: "Mettre en pause",
    disque: "NOTRE MUSIQUE"
  },

  /* ---- Lettre ---- */
  lettre: {
    sur: "UN MOT DE MA PART",
    titre: "Une lettre",
    sousTitre: "rien que pour toi",
    paragraphes: [
      "Ma princesse,",

  souvenirs: {

  /* ---- Moments marquants (frise) ---- */
  moments: {

    liste: [
      { date: "2026-04-27", titre: "Le début de notre histoire", image: "img/moment1.jpg", texte: "" },

  /* ---- Liste "Tout ce qui te rend unique" ---- */
  unique: {

  /* ---- Message vocal ---- */

  jeu: {

    choix: [
      { texte: "Paris",       reponse: "Paris avec toi, ça me va très bien." },

    ]
  },

  /* ---- Compteur (date passée = temps écoulé depuis ce jour, date future = compte à rebours) ---- */
  compteARebours: {
    actif: true,
    titre: "Ensemble depuis le 27 avril",
    date: "2026-04-27T00:00:00"           // format AAAA-MM-JJTHH:MM:SS
  },

  /* ---- Fin ---- */
  fin: {
    petit: "Je t'aime et je t'aimerai toujours",
    titre: "Pour ma princesse",
    prenom: "",                           // son prénom ou surnom (optionnel)
    imageFond: "img/fin.jpg",
    question: "Un petit geste en retour ?",
    reactions: [
      { emoji: "❤️", texte: "J'adore",      merci: "Ça me fait trop plaisir." },
      { emoji: "🥹", texte: "Tu m'as ému·e", merci: "Tu le mérites tellement." },
      { emoji: "💌", texte: "Un petit mot",  merci: "", whatsapp: true }
    ],
    petitMot: {
      indice: "Touche l'enveloppe",
      placeholder: "Écris ton petit mot ici...",
      entree: "Appuie sur Entrée pour l'envoyer",
      envoye: "Envoyé ❤️"
    },
    whatsappNumero: "",                   // ton numéro avec indicatif, sans + ni espaces (ex: 221770000000)
    whatsappMessage: "J'ai adoré ma surprise ❤️"
  }
};
/* ===================== FIN DE LA PARTIE MODIFIABLE ===================== */


/* ---------- utilitaires ---------- */
const $ = id => document.getElementById(id);
const C = CONTENU;
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const imgTag = (src, alt="") => `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.style.opacity=.15">`;

/* ---------- remplissage des textes ---------- */
$("gTag").textContent = "🔒 " + C.porte.etiquette;
$("gTitle").textContent = C.porte.titre;
$("gAsk").textContent = C.porte.question;
$("gInput").placeholder = C.porte.placeholder;
$("gBtn").textContent = C.porte.bouton;

$("eTitle").textContent = C.enveloppe.titre;
$("eSub").textContent = C.enveloppe.sousTitre;
$("eLetter").textContent = C.enveloppe.textLettre;
$("eHint").textContent = C.enveloppe.indice;

$("heroText").textContent = C.accroche;
$("giftsEyebrow").textContent = C.cadeaux.sur;
$("giftsTitle").textContent = C.cadeaux.titre;
$("giftsPic").innerHTML = imgTag(C.cadeaux.image, "");

$("musicLabel").textContent = "🔊 " + C.musique.legende;
$("musicBtn").textContent = "▷  " + C.musique.bouton;
$("music").src = C.musique.fichier;
$("vinyl").dataset.label = C.musique.disque;

$("letterEyebrow").textContent = C.lettre.sur;
$("letterTitle").innerHTML = esc(C.lettre.titre) + "<span>" + esc(C.lettre.sousTitre) + "</span>";
$("letterBody").innerHTML = C.lettre.paragraphes.map(p => `<p>${esc(p)}</p>`).join("");
$("letterSign").textContent = C.lettre.signature;

$("memEyebrow").textContent = C.souvenirs.sur;
$("memTitle").textContent = C.souvenirs.titre;
$("polas").innerHTML = C.souvenirs.photos.map(p =>
  `<figure class="pola">${imgTag(p.src, p.legende)}${p.legende ? `<figcaption>${esc(p.legende)}</figcaption>` : ""}</figure>`).join("");

$("tlEyebrow").textContent = C.moments.sur;
$("tlTitle").textContent = C.moments.titre;
$("timeline").innerHTML = C.moments.liste.map(m =>
  `<div class="tl"><time>${esc(m.date)}</time><h3>${esc(m.titre)}</h3>${imgTag(m.image, m.titre)}${m.texte ? `<p>${esc(m.texte)}</p>` : ""}</div>`).join("");

$("listTitle").textContent = C.unique.titre;
$("listItems").innerHTML = C.unique.items.map((t,i) => `<li><b>${String(i+1).padStart(2,"0")}</b><span>${esc(t)}</span></li>`).join("");

$("voiceLabel").textContent = "🔊 " + C.vocal.legende;
$("voice").src = C.vocal.fichier;
$("vinyl2").dataset.label = C.vocal.disque;

$("quizEyebrow").textContent = C.jeu.sur;
$("quizTitle").textContent = C.jeu.question;
$("quizOpts").innerHTML = C.jeu.choix.map((c,i) => `<button class="opt" data-i="${i}" type="button">${esc(c.texte)}</button>`).join("");

if (C.compteARebours.actif) $("countTitle").textContent = C.compteARebours.titre;
else $("secCount").classList.add("hidden");

$("finSmall").textContent = C.fin.petit;
$("finTitle").textContent = C.fin.titre;
$("finName").textContent = C.fin.prenom;
$("finAsk").textContent = C.fin.question;
$("reacts").innerHTML = C.fin.reactions.map((r,i) => `<button class="react" data-i="${i}" type="button"><em>${r.emoji}</em>${esc(r.texte)}</button>`).join("");
if (C.fin.imageFond) $("secFinal").style.setProperty("--final-bg", `url("${C.fin.imageFond}")`);

/* ---------- écran 1 : mot secret ---------- */
$("gateForm").addEventListener("submit", e => {
  e.preventDefault();
  if (norm($("gInput").value) === norm(C.motSecret)) {
    $("gate").classList.add("out");
    $("envScreen").classList.remove("out");
  } else {
    $("gErr").textContent = C.porte.erreur;
    $("gateForm").classList.remove("shake"); void $("gateForm").offsetWidth;
    $("gateForm").classList.add("shake");
  }
});

/* ---------- écran 2 : enveloppe ---------- */
$("env").addEventListener("click", function () {
  if (this.classList.contains("open")) return;
  this.classList.add("open");
  $("eHint").style.opacity = 0;
  setTimeout(() => {
    $("envScreen").classList.add("out");
    document.body.classList.remove("locked");
    $("site").classList.add("show");
    window.scrollTo(0, 0);
    // tentative de lecture auto de la musique (le clic a valu "interaction")
    toggleMusic(true);
  }, 2600);
});

/* ---------- musique ---------- */
const music = $("music"), mBtn = $("musicBtn"), vinyl = $("vinyl");
function setMusicUI(playing){
  vinyl.classList.toggle("spin", playing);
  mBtn.textContent = "▷  " + (playing ? C.musique.boutonPause : C.musique.bouton);
}
function toggleMusic(forcePlay){
  if (forcePlay === true || music.paused) {
    music.play().then(() => setMusicUI(true)).catch(() => setMusicUI(false));
  } else { music.pause(); setMusicUI(false); }
}
mBtn.addEventListener("click", () => toggleMusic());

/* le message vocal coupe la musique pendant qu'il joue */
const voice = $("voice");
voice.addEventListener("play", () => { music.pause(); setMusicUI(false); $("vinyl2").classList.add("spin"); });
voice.addEventListener("pause", () => $("vinyl2").classList.remove("spin"));
voice.addEventListener("ended", () => $("vinyl2").classList.remove("spin"));

/* ---------- frise : apparition au scroll ---------- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
document.querySelectorAll(".tl").forEach(el => io.observe(el));

/* ---------- jeu ---------- */
$("quizOpts").addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b) return;
  document.querySelectorAll(".opt").forEach(o => o.classList.remove("picked"));
  b.classList.add("picked");
  $("quizReply").textContent = C.jeu.choix[b.dataset.i].reponse;
});

/* ---------- compte à rebours ---------- */
if (C.compteARebours.actif) {
  const target = new Date(C.compteARebours.date).getTime();
  const tick = () => {
    let d = Math.abs(target - Date.now());
    $("cD").textContent = Math.floor(d / 864e5);
    $("cH").textContent = Math.floor(d % 864e5 / 36e5);
    $("cM").textContent = Math.floor(d % 36e5 / 6e4);
    $("cS").textContent = Math.floor(d % 6e4 / 1e3);
  };
  tick(); setInterval(tick, 1000);
}

/* ---------- petit mot : enveloppe + lettre ---------- */
const mot = $("mot"), motEnv = $("motEnv"), motInput = $("motInput");
$("motInput").placeholder = C.fin.petitMot.placeholder;
$("motSmall").textContent = C.fin.petitMot.entree;
function openMot(){
  motEnv.classList.remove("open"); mot.classList.remove("out");
  motInput.value = ""; $("motHint").textContent = C.fin.petitMot.indice;
  mot.classList.add("on");
}
function closeMot(){ mot.classList.remove("on"); }
motEnv.addEventListener("click", () => {
  if (motEnv.classList.contains("open")) return;
  motEnv.classList.add("open");
  $("motHint").textContent = "";
  setTimeout(() => { mot.classList.add("out"); motInput.focus(); }, 700);
});
motInput.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const txt = motInput.value.trim(); if (!txt) return;
  if (C.fin.whatsappNumero) {
    window.open(`https://wa.me/${C.fin.whatsappNumero}?text=${encodeURIComponent(txt)}`, "_blank");
  }
  $("motHint").textContent = C.fin.petitMot.envoye;
  motInput.blur();
  setTimeout(closeMot, 1800);
});
$("motX").addEventListener("click", closeMot);

/* ---------- réactions ---------- */
$("reacts").addEventListener("click", e => {
  const b = e.target.closest(".react"); if (!b) return;
  const r = C.fin.reactions[b.dataset.i];
  for (let i = 0; i < 7; i++) {
    const f = document.createElement("span");
    f.className = "float"; f.textContent = r.emoji;
    f.style.left = (10 + Math.random() * 80) + "%";
    f.style.animationDelay = (i * .12) + "s";
    document.body.appendChild(f); setTimeout(() => f.remove(), 2600);
  }
  if (r.whatsapp) {
    openMot();
  } else if (r.merci) {
    $("thanks").textContent = r.merci;
  }
});
</script>
</body>
</html>
